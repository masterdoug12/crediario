version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fiados-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost
      APP_TIMEZONE: America/Sao_Paulo
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: crediario
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      - db

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: fiados-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
    volumes:
      - ./backend:/var/www/html

  db:
    image: postgres:16-alpine
    container_name: fiados-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: crediario
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  node:
    image: node:22-alpine
    container_name: fiados-node
    working_dir: /var/www/frontend
    command: sh -c "npm install && npm run build -- --watch"
    volumes:
      - ./frontend:/var/www/frontend
      - ./backend:/var/www/backend
    environment:
      VITE_API_BASE_URL: http://localhost/api
    depends_on:
      - app

  # === NOVO SERVIÇO: n8n ===
  n8n:
    build:
      context: .
      dockerfile: docker/n8n/Dockerfile
    container_name: fiados-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"           # UI do n8n
    environment:
      # Ajuste o host se quiser acessar de outra máquina
      N8N_HOST: "localhost"
      N8N_PORT: 5678
      N8N_PROTOCOL: "http"
      # Define timezone para os horários dos workflows
      GENERIC_TIMEZONE: "America/Sao_Paulo"
    volumes:
      - n8n_data:/home/node/.n8n   # dados do n8n (credenciais, workflows)
      - n8n_tmp:/tmp               # onde salvaremos o dump
    depends_on:
      - db                         # garante que o serviço 'db' já esteja na rede

volumes:
  postgres_data:
  n8n_data:
  n8n_tmp:
